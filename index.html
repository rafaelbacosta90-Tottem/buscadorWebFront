<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hub Licitações - PNCP Web</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 min-h-screen flex flex-col">
  <div id="tela-login" class="min-h-screen bg-slate-900 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8 border border-slate-100">
      <div class="text-center mb-8">
        <div class="bg-blue-600 text-white w-12 h-12 rounded-xl flex items-center justify-center mx-auto mb-3 font-bold text-xl shadow-lg">PNCP</div>
        <h2 class="text-2xl font-bold text-slate-900">Hub Licitações</h2>
      </div>
      <div id="auth-error" class="hidden mb-4 p-3 bg-red-50 text-red-600 rounded-lg text-xs font-bold border border-red-200"></div>
      <form id="form-login" class="space-y-4">
        <div><label class="block text-xs font-bold text-slate-600 uppercase mb-1">E-mail</label><input type="email" id="email" required class="w-full px-4 py-2.5 bg-slate-50 border rounded-lg text-sm text-slate-900"></div>
        <div><label class="block text-xs font-bold text-slate-600 uppercase mb-1">Senha</label><input type="password" id="password" required class="w-full px-4 py-2.5 bg-slate-50 border rounded-lg text-sm text-slate-900"></div>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg text-sm shadow-md">Entrar</button>
      </form>
    </div>
  </div>

  <div id="tela-dashboard" class="hidden flex-col min-h-screen">
    <header class="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-40">
      <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
        <div class="flex items-center space-x-3"><div class="bg-blue-600 p-2 rounded-lg font-bold text-lg">PNCP</div><span class="font-semibold text-lg tracking-wide">Buscador</span></div>
        <div class="flex items-center space-x-4">
          <div class="text-right"><span id="user-empresa" class="text-xs font-bold text-amber-400 block">--</span><span id="user-nome" class="text-[10px] text-slate-400 block">--</span></div>
          <a id="link-admin" href="admin.html" class="hidden text-xs bg-slate-800 text-amber-400 font-bold px-3 py-1.5 rounded-lg border border-slate-700">Admin</a>
          <button id="btn-logout" class="bg-slate-800 text-slate-300 px-3 py-1.5 rounded-lg text-xs border border-slate-700">Sair</button>
        </div>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-6 space-y-6 flex-1 w-full">
      <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
          <div class="md:col-span-3">
            <div class="flex justify-between mb-1"><label class="block text-xs font-bold text-slate-600 uppercase">Termo:</label><button onclick="document.getElementById('modal-palavras-chave').classList.remove('hidden'); carregarPalavrasChave()" class="text-xs font-bold text-amber-600">Minhas Palavras-Chave</button></div>
            <input type="text" id="input-termo" placeholder="Digite o termo" class="w-full px-3.5 py-2 bg-slate-50 border rounded-lg text-sm">
          </div>
          <div><label class="block text-xs font-bold text-slate-600 uppercase mb-1">Onde buscar:</label><select id="select-onde-buscar" class="w-full bg-slate-50 border py-2 px-3 rounded-lg text-sm"><option value="todos">Item e Objeto</option><option value="item">Só Item</option><option value="objeto">Só Objeto</option></select></div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
          <div><label class="block text-xs font-bold text-slate-600 uppercase mb-1">Filtrar Data:</label><select id="select-tipo-data" class="w-full bg-slate-50 border py-2 px-3 rounded-lg text-sm"><option value="publicacao">Publicação</option><option value="abertura">Abertura</option><option value="encerramento">Encerramento</option></select></div>
          <div class="md:col-span-2"><label class="block text-xs font-bold text-slate-600 uppercase mb-1">Período:</label><div class="flex gap-2"><input type="date" id="input-dt-inicio" class="w-1/2 px-3 py-1.5 bg-slate-50 border rounded-lg text-xs"><input type="date" id="input-dt-fim" class="w-1/2 px-3 py-1.5 bg-slate-50 border rounded-lg text-xs"></div></div>
          <div><label class="block text-xs font-bold text-slate-600 uppercase mb-1">Status:</label><select id="select-status-edital" class="w-full bg-slate-50 border py-2 px-3 rounded-lg text-sm"><option value="todos">Todos</option><option value="encerradas">Encerradas</option><option value="recebendo">Recebendo Proposta</option></select></div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-5 gap-3">
          <div><label class="block text-xs font-bold text-slate-600 uppercase mb-1">Portais:</label><button onclick="document.getElementById('modal-portais').classList.remove('hidden')" class="w-full bg-blue-50 text-blue-700 py-2 px-3 rounded-lg text-sm font-bold flex justify-between"><span id="lbl-portais">Todos</span><i data-lucide="chevron-down" class="w-4 h-4"></i></button></div>
          <div><label class="block text-xs font-bold text-slate-600 uppercase mb-1">Exibir Valor:</label><select id="select-exibir-valor" onchange="renderTabela()" class="w-full bg-slate-50 border py-2 px-2.5 rounded-lg text-sm"><option value="total_item">Total do Item</option><option value="unitario_item">Unitário do Item</option><option value="total_edital">Total do Edital</option></select></div>
          <div><label class="block text-xs font-bold text-slate-600 uppercase mb-1">Modalidade:</label><select id="select-modalidade" class="w-full bg-slate-50 border py-2 px-3 rounded-lg text-sm"><option value="">Todas</option><option value="8">Dispensa</option><option value="6">Pregão Eletrônico</option><option value="4">Concorrência</option></select></div>
          <div><label class="block text-xs font-bold text-slate-600 uppercase mb-1">UF:</label><select id="select-uf" class="w-full bg-slate-50 border py-2 px-3 rounded-lg text-sm"><option value="Todas">Todas</option><option value="SP">SP</option><option value="MG">MG</option><option value="GO">GO</option><option value="DF">DF</option><option value="PR">PR</option><option value="RS">RS</option><option value="RJ">RJ</option><option value="SC">SC</option></select></div>
          <div><label class="block text-xs font-bold text-slate-600 uppercase mb-1">Nº Edital / UASG:</label><input type="text" id="input-edital" placeholder="Nº ou UASG" class="w-full px-3 py-2 bg-slate-50 border rounded-lg text-sm"></div>
        </div>
        <button onclick="buscar(1)" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-4 rounded-lg shadow flex items-center justify-center gap-2"><i data-lucide="search" class="w-4 h-4"></i> Pesquisar</button>
      </div>

      <div class="bg-white rounded-2xl border shadow overflow-hidden">
        <div class="p-4 bg-slate-50 border-b flex justify-between"><span class="text-xs font-bold uppercase text-slate-500">Resultados</span><span id="lbl-total" class="text-xs font-bold text-blue-600">0</span></div>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm border-collapse">
            <thead class="bg-slate-100 text-slate-600 font-bold uppercase text-xs"><tr><th class="py-3 px-4">Órgão</th><th class="py-3 px-4">Edital</th><th class="py-3 px-4">Descrição</th><th class="py-3 px-4">Valor</th><th class="py-3 px-4 text-center">Ações</th></tr></thead>
            <tbody id="tabela-corpo" class="divide-y divide-slate-100"><tr><td colSpan="5" class="py-12 text-center text-slate-400">Clique em Pesquisar</td></tr></tbody>
          </table>
        </div>
        <div class="p-4 border-t bg-slate-50 flex justify-between"><span id="info-pag" class="text-xs">Pag 1</span><div class="flex gap-2"><button id="btn-prev" class="px-3 py-1.5 bg-white border rounded text-xs">Anterior</button><button id="btn-next" class="px-3 py-1.5 bg-white border rounded text-xs">Próximo</button></div></div>
      </div>
    </main>
  </div>

  <div id="modal-palavras-chave" class="hidden fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden border">
      <div class="p-4 border-b flex gap-2"><input type="text" id="nova-palavra" class="flex-1 px-3 border rounded text-sm"><button onclick="addPalavra()" class="px-4 bg-blue-600 text-white rounded font-bold text-sm">Add</button><button onclick="document.getElementById('modal-palavras-chave').classList.add('hidden')" class="px-4 bg-slate-200 rounded font-bold text-sm">X</button></div>
      <div id="lista-palavras" class="p-4 max-h-60 overflow-y-auto space-y-2"></div>
      <div class="p-4 text-center border-t"><button onclick="usarTodas()" class="bg-emerald-600 text-white px-4 py-2 rounded text-sm font-bold">Usar Todas</button></div>
    </div>
  </div>

  <div id="modal-portais" class="hidden fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded w-full max-w-sm"><div class="p-4 bg-slate-900 text-white flex justify-between"><b>Portais</b><button onclick="document.getElementById('modal-portais').classList.add('hidden')">X</button></div>
    <div id="lista-portais" class="p-4 max-h-60 overflow-y-auto"></div></div>
  </div>

  <div id="modal-anexos" class="hidden fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4"><div class="bg-white rounded-xl w-full max-w-xl"><div class="p-4 bg-slate-900 text-white flex justify-between"><b>Anexos</b><button onclick="document.getElementById('modal-anexos').classList.add('hidden')">X</button></div><div id="lista-anexos" class="p-4 space-y-2 max-h-80 overflow-y-auto"></div></div></div>
  
  <div id="modal-ia" class="hidden fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4"><div class="bg-white rounded-xl w-full max-w-2xl"><div class="p-4 bg-indigo-900 text-white flex justify-between"><b>Análise IA</b><button onclick="document.getElementById('modal-ia').classList.add('hidden')">X</button></div><div id="res-ia" class="p-6 text-sm max-h-96 overflow-y-auto whitespace-pre-wrap font-mono bg-slate-50"></div></div></div>

  <script>
    const API = "https://buscador-web-6i6s.onrender.com";
    let user = null, dados = [], page = 1, totalP = 1, palavras = [];

    document.getElementById('form-login').onsubmit = async(e) => {
      e.preventDefault();
      try {
        const r = await fetch(`${API}/api/auth/login`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email:email.value, senha:password.value})});
        const d = await r.json();
        if(r.ok) { localStorage.setItem('s', JSON.stringify(d)); checkAuth(); } else alert(d.detail);
      } catch(e) { alert("Erro de rede."); }
    };
    document.getElementById('btn-logout').onclick = () => { localStorage.removeItem('s'); checkAuth(); };

    async function checkAuth() {
      user = JSON.parse(localStorage.getItem('s'));
      if(user) {
        document.getElementById('tela-login').classList.add('hidden'); document.getElementById('tela-dashboard').classList.remove('hidden'); document.getElementById('tela-dashboard').classList.add('flex');
        document.getElementById('user-empresa').innerText = user.empresa; document.getElementById('user-nome').innerText = user.usuario;
        if(user.is_admin) document.getElementById('link-admin').classList.remove('hidden');
        await loadPortais();
        fetch(`${API}/api/palavras-chave?user_id=${user.user_id}`).then(r=>r.json()).then(d=>{ if(d.palavras) document.getElementById('input-termo').value = d.palavras.map(p=>p.termo).join(', '); buscar(1); });
      } else {
        document.getElementById('tela-dashboard').classList.add('hidden'); document.getElementById('tela-login').classList.remove('hidden');
      }
    }

    async function buscar(p) {
      page = p; document.getElementById('tabela-corpo').innerHTML = `<tr><td colSpan="5" class="p-8 text-center text-slate-400">Buscando...</td></tr>`;
      const q = new URLSearchParams({pagina: p, limite: 50, onde_buscar: document.getElementById('select-onde-buscar').value, status_edital: document.getElementById('select-status-edital').value, tipo_data: document.getElementById('select-tipo-data').value});
      if(document.getElementById('input-termo').value) q.append('termo', document.getElementById('input-termo').value);
      if(document.getElementById('input-dt-inicio').value) q.append('data_inicio', document.getElementById('input-dt-inicio').value);
      if(document.getElementById('input-dt-fim').value) q.append('data_fim', document.getElementById('input-dt-fim').value);
      if(document.getElementById('select-modalidade').value) q.append('modalidade_id', document.getElementById('select-modalidade').value);
      if(document.getElementById('select-uf').value !== 'Todas') q.append('uf', document.getElementById('select-uf').value);
      if(document.getElementById('input-edital').value) { q.append('edital', document.getElementById('input-edital').value); q.append('uasg', document.getElementById('input-edital').value); }
      const pts = Array.from(document.querySelectorAll('.chk-portal:checked')).map(c=>c.value); if(pts.length) q.append('portais', pts.join(','));

      const r = await fetch(`${API}/api/licitacoes/pesquisar?${q}`);
      const d = await r.json(); dados = d.dados || []; totalP = d.total_paginas;
      document.getElementById('lbl-total').innerText = d.total_registros; document.getElementById('info-pag').innerText = `Pág ${page} de ${totalP}`;
      document.getElementById('btn-prev').disabled = page<=1; document.getElementById('btn-next').disabled = page>=totalP;
      renderTabela();
    }

    function renderTabela() {
      const tb = document.getElementById('tabela-corpo'); const valT = document.getElementById('select-exibir-valor').value;
      if(!dados.length) { tb.innerHTML = `<tr><td colSpan="5" class="p-8 text-center">Sem resultados</td></tr>`; return; }
      tb.innerHTML = dados.map((i, idx) => {
        let v = i.valor_total_estimado; if(valT==='unitario_item') v = i.valor_unitario_estimado; else if(valT==='total_edital') v = i.valor_total_compra;
        return `<tr class="border-b text-xs"><td class="p-3"><b>${i.orgao_nome}</b> (${i.uf})</td><td class="p-3">${i.numero_compra||i.sequencial}<br><span class="text-slate-400">${i.modalidade_nome}</span></td><td class="p-3 max-w-xs truncate">${i.descricao_item}</td><td class="p-3">R$ ${Number(v||0).toLocaleString('pt-BR')}</td><td class="p-3 text-center"><button onclick="abrirIA(${idx})" class="text-indigo-600 font-bold px-2">IA</button><button onclick="abrirAnexos('${i.cnpj_orgao}',${i.ano},${i.sequencial})" class="text-amber-600 font-bold px-2">PDFs</button></td></tr>`;
      }).join('');
    }

    async function loadPortais() {
      const r = await fetch(`${API}/api/licitacoes/portais`); const d = await r.json();
      document.getElementById('lista-portais').innerHTML = d.portais.map(p=>`<label class="block"><input type="checkbox" class="chk-portal" value="${p}"> ${p}</label>`).join('');
    }
    async function carregarPalavrasChave() {
      const r = await fetch(`${API}/api/palavras-chave?user_id=${user.user_id}`); const d = await r.json(); palavras = d.palavras || [];
      document.getElementById('lista-palavras').innerHTML = palavras.map(p=>`<div class="flex justify-between p-2 border-b"><span>${p.termo}</span><button onclick="delPalavra(${p.id})" class="text-red-500">X</button></div>`).join('');
    }
    async function addPalavra() {
      await fetch(`${API}/api/palavras-chave`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({user_id:user.user_id, termo:document.getElementById('nova-palavra').value})});
      document.getElementById('nova-palavra').value=''; carregarPalavrasChave();
    }
    async function delPalavra(id) { await fetch(`${API}/api/palavras-chave/${id}`, {method:'DELETE'}); carregarPalavrasChave(); }
    function usarTodas() { document.getElementById('input-termo').value = palavras.map(p=>p.termo).join(', '); document.getElementById('modal-palavras-chave').classList.add('hidden'); buscar(1); }
    
    async function abrirAnexos(c,a,s) {
      document.getElementById('modal-anexos').classList.remove('hidden'); document.getElementById('lista-anexos').innerHTML = "Buscando...";
      const r = await fetch(`${API}/api/licitacoes/arquivos?cnpj=${c}&ano=${a}&sequencial=${s}`); const d = await r.json();
      document.getElementById('lista-anexos').innerHTML = d.arquivos.map(x=>`<div class="flex justify-between p-2 border-b text-xs"><span>${x.titulo}</span><a href="${x.url}" target="_blank" class="text-blue-600">Download</a></div>`).join('');
    }
    async function abrirIA(idx) {
      document.getElementById('modal-ia').classList.remove('hidden'); document.getElementById('res-ia').innerHTML = "Analisando com IA...";
      const i = dados[idx]; const r = await fetch(`${API}/api/licitacoes/analisar-ia`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({user_id:user.user_id, ano:i.ano, sequencial:i.sequencial, cnpj_orgao:i.cnpj_orgao})});
      const d = await r.json(); document.getElementById('res-ia').innerHTML = r.ok ? `<b>Provedor:</b> ${d.provedor}\n\n${d.relatorio}` : "Erro IA.";
    }

    document.getElementById('btn-prev').onclick=()=>buscar(page-1); document.getElementById('btn-next').onclick=()=>buscar(page+1);
    checkAuth(); lucide.createIcons();
  </script>
</body>
</html>
