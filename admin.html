<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Admin - Hub Licitações</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen">

  <script>
    // BLOQUEIO DE SEGURANÇA IMEDIATO NO CARREGAMENTO DA PÁGINA
    (function verificarAcessoAdmin() {
      const sessaoSalva = localStorage.getItem('usuario_sessao');
      if (!sessaoSalva) {
        window.location.href = 'index.html';
        return;
      }
      const usuario = JSON.parse(sessaoSalva);
      if (usuario.is_admin !== true) {
        alert('Acesso negado. Apenas administradores podem acessar esta página.');
        window.location.href = 'index.html';
      }
    })();
  </script>

  <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-amber-500 text-slate-950 p-2 rounded-lg font-bold text-lg">ADMIN</div>
        <span class="font-semibold text-lg">Painel de Controle e Automação</span>
      </div>
      <a href="index.html" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg border border-slate-600">
        ← Voltar ao App
      </a>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-8 space-y-8">

    <!-- CADASTRO DE NOVO USUÁRIO -->
    <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl space-y-4">
      <h2 class="text-lg font-bold text-amber-400 flex items-center gap-2">
        <i data-lucide="user-plus" class="w-5 h-5"></i> Cadastrar Novo Usuário e CNPJ
      </h2>
      <div id="msg-cad-user" class="hidden p-3 rounded-lg text-xs font-bold"></div>
      <form id="form-cad-user" class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-xs font-bold text-slate-400 uppercase mb-1">CNPJ da Empresa</label>
          <input type="text" id="cad-cnpj" required placeholder="Apenas números" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Razão Social</label>
          <input type="text" id="cad-razao" required placeholder="Nome da empresa" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Nome Completo do Usuário</label>
          <input type="text" id="cad-nome" required placeholder="Nome do responsável" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-400 uppercase mb-1">E-mail de Login</label>
          <input type="email" id="cad-email" required placeholder="usuario@empresa.com" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Senha</label>
          <input type="text" id="cad-senha" required value="123456" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Validade (Dias)</label>
          <input type="number" id="cad-dias" required value="30" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Limite Diário de IA</label>
          <input type="number" id="cad-limite-ia" required value="10" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Perfil Administrador?</label>
          <select id="cad-is-admin" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white">
            <option value="false">Não (Usuário Comum)</option>
            <option value="true">Sim (Administrador)</option>
          </select>
        </div>
        <div class="flex items-end">
          <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2 px-4 rounded-lg text-sm">
            Salvar Usuário & Licença
          </button>
        </div>
      </form>
    </div>

    <!-- AGENDAMENTO AUTOMÁTICO -->
    <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl space-y-4">
      <h2 class="text-lg font-bold text-blue-400 flex items-center gap-2">
        <i data-lucide="clock" class="w-5 h-5"></i> Agendamento Automático de Varredura
      </h2>
      <div id="msg-agendamento" class="hidden p-3 rounded-lg text-xs font-bold"></div>
      <form id="form-agendamento" class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
        <div>
          <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Status da Varredura Auto</label>
          <select id="agd-ativo" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white">
            <option value="false">Desativado</option>
            <option value="true">Ativado</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Intervalo (Minutos)</label>
          <input type="number" id="agd-intervalo" required value="60" min="15" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Dias Retroativos</label>
          <input type="number" id="agd-dias" required value="2" min="1" max="10" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white">
        </div>
        <div>
          <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-4 rounded-lg text-sm">
            Salvar Agendamento
          </button>
        </div>
      </form>
    </div>

    <!-- CONTROLADOR DE SINCRONIZAÇÃO MANUAL -->
    <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl space-y-4">
      <div class="flex justify-between items-center">
        <div>
          <h2 class="text-lg font-bold text-emerald-400 flex items-center gap-2">
            <i data-lucide="refresh-cw" class="w-5 h-5"></i> Sincronização Manual Direta
          </h2>
          <p class="text-xs text-slate-400 mt-1">Dispare a busca manual a qualquer momento sem travar o servidor</p>
        </div>
        <div class="flex gap-2">
          <button id="btn-sync-now" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-4 py-2 rounded-lg text-sm flex items-center gap-1">
            <i data-lucide="play" class="w-4 h-4"></i> Iniciar Agora
          </button>
          <button id="btn-sync-stop" disabled class="bg-red-600/20 text-red-400 border border-red-600/50 font-bold px-4 py-2 rounded-lg text-sm disabled:opacity-40">
            Parar
          </button>
        </div>
      </div>
      <div class="pt-2 border-t border-slate-700">
        <span id="sync-msg" class="text-xs text-slate-300 font-medium">Aguardando comando...</span>
      </div>
    </div>

  </main>

  <script>
    const API_URL = "https://buscador-web-6i6s.onrender.com";
    const sessao = JSON.parse(localStorage.getItem('usuario_sessao') || '{}');
    const adminId = sessao.user_id || '';

    async function carregarAgendamento() {
      try {
        const res = await fetch(`${API_URL}/api/admin/agendamento`);
        const data = await res.json();
        document.getElementById('agd-ativo').value = data.ativo ? "true" : "false";
        document.getElementById('agd-intervalo').value = data.intervalo_minutos || 60;
        document.getElementById('agd-dias').value = data.dias_retroativos || 2;
      } catch (e) {}
    }

    document.getElementById('form-agendamento').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msgBox = document.getElementById('msg-agendamento');
      try {
        const res = await fetch(`${API_URL}/api/admin/agendamento?admin_id=${adminId}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            ativo: document.getElementById('agd-ativo').value === "true",
            intervalo_minutos: parseInt(document.getElementById('agd-intervalo').value),
            dias_retroativos: parseInt(document.getElementById('agd-dias').value)
          })
        });
        const data = await res.json();
        msgBox.textContent = data.message;
        msgBox.className = "p-3 rounded-lg text-xs font-bold bg-emerald-900/50 text-emerald-300 border border-emerald-700";
        msgBox.classList.remove('hidden');
      } catch (err) {
        msgBox.textContent = "Erro ao salvar agendamento.";
        msgBox.className = "p-3 rounded-lg text-xs font-bold bg-red-900/50 text-red-300 border border-red-700";
        msgBox.classList.remove('hidden');
      }
    });

    document.getElementById('form-cad-user').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msgBox = document.getElementById('msg-cad-user');
      try {
        const res = await fetch(`${API_URL}/api/admin/usuarios?admin_id=${adminId}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            cnpj: document.getElementById('cad-cnpj').value,
            razao_social: document.getElementById('cad-razao').value,
            nome_completo: document.getElementById('cad-nome').value,
            email: document.getElementById('cad-email').value,
            senha: document.getElementById('cad-senha').value,
            dias_validade: parseInt(document.getElementById('cad-dias').value),
            limite_ia: parseInt(document.getElementById('cad-limite-ia').value),
            is_admin: document.getElementById('cad-is-admin').value === "true"
          })
        });
        const data = await res.json();
        if (res.ok) {
          msgBox.textContent = data.message;
          msgBox.className = "p-3 rounded-lg text-xs font-bold bg-emerald-900/50 text-emerald-300 border border-emerald-700";
        } else {
          msgBox.textContent = data.detail || "Erro no cadastro.";
          msgBox.className = "p-3 rounded-lg text-xs font-bold bg-red-900/50 text-red-300 border border-red-700";
        }
        msgBox.classList.remove('hidden');
      } catch (err) {
        msgBox.textContent = "Falha ao conectar com o servidor.";
        msgBox.className = "p-3 rounded-lg text-xs font-bold bg-red-900/50 text-red-300 border border-red-700";
        msgBox.classList.remove('hidden');
      }
    });

    document.getElementById('btn-sync-now').addEventListener('click', async () => {
      await fetch(`${API_URL}/api/admin/sincronizar?admin_id=${adminId}`, { method: 'POST' });
    });

    document.getElementById('btn-sync-stop').addEventListener('click', async () => {
      await fetch(`${API_URL}/api/admin/parar-sincronizacao?admin_id=${adminId}`, { method: 'POST' });
    });

    async function checarStatusSync() {
      try {
        const res = await fetch(`${API_URL}/api/admin/status-sincronizacao`);
        const data = await res.json();
        document.getElementById('sync-msg').textContent = data.progresso.mensagem || "Pronto.";
        document.getElementById('btn-sync-now').disabled = data.ativa;
        document.getElementById('btn-sync-stop').disabled = !data.ativa;
      } catch (e) {}
    }

    setInterval(checarStatusSync, 2000);
    carregarAgendamento();
    lucide.createIcons();
  </script>
</body>
</html>
