<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Hub Licitações</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800">
  <header class="bg-slate-900 text-white p-4 flex justify-between items-center">
    <div class="font-bold text-lg">ADMIN - Painel de Controle</div>
    <div class="flex gap-4"><a href="index.html" class="text-blue-400 font-bold">Voltar ao Buscador</a><button onclick="sair()" class="text-red-400 font-bold">Sair</button></div>
  </header>

  <main class="max-w-6xl mx-auto p-6 space-y-8">
    <div class="bg-white p-6 rounded-xl border shadow">
      <div class="flex justify-between items-center mb-4"><h2 class="font-bold text-xl">Usuários e Licenças</h2><button onclick="document.getElementById('modal-usuario').classList.remove('hidden')" class="bg-blue-600 text-white px-4 py-2 rounded font-bold text-sm">Novo Usuário</button></div>
      <table class="w-full text-left text-sm"><thead class="bg-slate-100"><tr><th class="p-3">Nome</th><th class="p-3">Email</th><th class="p-3">Empresa</th><th class="p-3">Ações</th></tr></thead><tbody id="tb-users"></tbody></table>
    </div>

    <div class="bg-white p-6 rounded-xl border shadow space-y-4">
      <h2 class="font-bold text-xl">Robô de Sincronização (PNCP)</h2>
      <div class="flex gap-4 items-center">
        <button onclick="syncStart()" class="bg-indigo-600 text-white px-4 py-2 rounded font-bold">Forçar Varredura Manual</button>
        <button onclick="syncStop()" class="bg-red-600 text-white px-4 py-2 rounded font-bold">Parar Sincronização</button>
      </div>
      <div id="sync-status" class="p-4 bg-slate-900 text-green-400 font-mono text-sm rounded hidden"></div>
      
      <div class="pt-4 border-t mt-4 grid grid-cols-3 gap-4">
        <div><label class="block text-xs font-bold">Agendamento Ativo</label><select id="ag-ativo" class="border p-2 rounded w-full"><option value="true">Sim</option><option value="false">Não</option></select></div>
        <div><label class="block text-xs font-bold">Intervalo (Minutos)</label><input type="number" id="ag-min" class="border p-2 rounded w-full"></div>
        <div><label class="block text-xs font-bold">Dias Retroativos</label><input type="number" id="ag-dias" class="border p-2 rounded w-full"></div>
        <button onclick="salvarAg()" class="col-span-3 bg-slate-800 text-white p-2 rounded font-bold">Salvar Configuração Automática</button>
      </div>
    </div>
  </main>

  <div id="modal-usuario" class="hidden fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4">
    <div class="bg-white p-6 rounded-xl w-full max-w-sm space-y-3">
      <h3 class="font-bold text-lg border-b pb-2">Cadastrar Usuário</h3>
      <input type="text" id="nu-razao" placeholder="Razão Social" class="w-full border p-2 text-sm rounded">
      <input type="text" id="nu-cnpj" placeholder="CNPJ (só números)" class="w-full border p-2 text-sm rounded">
      <input type="text" id="nu-nome" placeholder="Nome Completo" class="w-full border p-2 text-sm rounded">
      <input type="email" id="nu-email" placeholder="E-mail" class="w-full border p-2 text-sm rounded">
      <input type="password" id="nu-senha" placeholder="Senha" class="w-full border p-2 text-sm rounded">
      <label class="flex items-center gap-2 text-sm font-bold"><input type="checkbox" id="nu-admin"> Administrador</label>
      <div class="flex justify-end gap-2 pt-2"><button onclick="document.getElementById('modal-usuario').classList.add('hidden')" class="px-4 py-2 bg-slate-200 rounded text-sm font-bold">Cancelar</button><button onclick="addUsr()" class="px-4 py-2 bg-blue-600 text-white rounded text-sm font-bold">Salvar</button></div>
    </div>
  </div>

  <script>
    const API = "https://buscador-web-6i6s.onrender.com";
    let user = JSON.parse(localStorage.getItem('s'));
    if(!user || !user.is_admin) { alert("Acesso restrito"); window.location.href="index.html"; }

    function sair() { localStorage.removeItem('s'); window.location.href="index.html"; }

    async function loadU() {
      const r = await fetch(`${API}/api/admin/usuarios?admin_id=${user.user_id}`); const d = await r.json();
      document.getElementById('tb-users').innerHTML = d.usuarios.map(u=>`<tr class="border-b text-sm"><td class="p-3">${u.nome_completo}</td><td class="p-3">${u.email}</td><td class="p-3">${u.empresas?u.empresas.razao_social:'-'}</td><td class="p-3"><button onclick="delU('${u.id}')" class="text-red-500 font-bold">Excluir</button></td></tr>`).join('');
    }

    async function addUsr() {
      await fetch(`${API}/api/admin/usuarios?admin_id=${user.user_id}`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({razao_social:document.getElementById('nu-razao').value, cnpj:document.getElementById('nu-cnpj').value, nome_completo:document.getElementById('nu-nome').value, email:document.getElementById('nu-email').value, senha:document.getElementById('nu-senha').value, is_admin:document.getElementById('nu-admin').checked})});
      document.getElementById('modal-usuario').classList.add('hidden'); loadU();
    }
    async function delU(id) { if(confirm("Certeza?")) { await fetch(`${API}/api/admin/usuarios/${id}?admin_id=${user.user_id}`, {method:'DELETE'}); loadU(); } }

    async function syncStart() { await fetch(`${API}/api/admin/sincronizar?admin_id=${user.user_id}`, {method:'POST'}); checkSync(); }
    async function syncStop() { await fetch(`${API}/api/admin/parar-sincronizacao?admin_id=${user.user_id}`, {method:'POST'}); }
    
    function checkSync() {
      setInterval(async()=>{
        const r = await fetch(`${API}/api/admin/sincronizacao-status?admin_id=${user.user_id}`); const d = await r.json();
        const bx = document.getElementById('sync-status');
        if(d.em_andamento || d.mensagem.includes('Finalizado')) { bx.classList.remove('hidden'); bx.innerText = d.mensagem; }
      }, 3000);
    }

    async function loadAg() {
      const r = await fetch(`${API}/api/admin/agendamento?admin_id=${user.user_id}`); const d = await r.json();
      document.getElementById('ag-ativo').value = d.ativo ? "true" : "false"; document.getElementById('ag-min').value = d.intervalo_minutos; document.getElementById('ag-dias').value = d.dias_retroativos;
    }
    async function salvarAg() {
      await fetch(`${API}/api/admin/agendamento?admin_id=${user.user_id}`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ativo: document.getElementById('ag-ativo').value==="true", intervalo_minutos: parseInt(document.getElementById('ag-min').value), dias_retroativos: parseInt(document.getElementById('ag-dias').value)})});
      alert("Configuração Salva!");
    }

    loadU(); loadAg(); checkSync();
  </script>
</body>
</html>
